[options]
; =============================================================================
;                         ODOO 19 MASTER CONFIGURATION
; =============================================================================
; Optimized for: User 'odoo19', WSL2/Ubuntu, PostgreSQL 16, Nginx, PgBouncer, Redis
; =============================================================================

; -----------------------------------------------------------------------------
; 1. GENERAL & SERVER
; -----------------------------------------------------------------------------
http_enable = True
http_interface = 0.0.0.0
http_port = 8019
https = False
; CRITICAL: Must be True when behind Nginx to handle headers and websockets correctly.
proxy_mode = True
; pidfile = /var/run/odoo/odoo.pid
; pg_path = False
server_wide_modules = base,web

; -----------------------------------------------------------------------------
; 2. DATABASE CONNECTION (Routing through PgBouncer on port 6432)
; -----------------------------------------------------------------------------
db_host = 127.0.0.1
; Port 6432 connects to PgBouncer. Use 5432 only if bypassing PgBouncer.
db_port = 6432
db_user = odoo19
db_password = 999239
db_name = False
db_maxconn = 64
db_sslmode = prefer
dbfilter = ^.*$
db_template = template0
unaccent = False
; log_db = False
; log_db_level = warning

; -----------------------------------------------------------------------------
; 3. ADDONS PATHS & FILE STORAGE
; -----------------------------------------------------------------------------
addons_path = /home/odoo19/odoo19/odoo/addons,/home/odoo19/odoo19/custom_addons
data_dir = /home/odoo19/odoo19/filestore

; -----------------------------------------------------------------------------
; 4. SECURITY & MASTER PASSWORD
; -----------------------------------------------------------------------------
admin_passwd = 999239
; csv_internal_sep = ,
list_db = True

; -----------------------------------------------------------------------------
; 5. LOGGING & MONITORING
; -----------------------------------------------------------------------------
logfile = /home/odoo19/odoo19/logs/odoo.log
log_level = info
log_handler = :INFO
log_rotate = 30
; syslog = False

; -----------------------------------------------------------------------------
; 6. PERFORMANCE & WORKER PROCESSES
; -----------------------------------------------------------------------------
; Formula: (CPU cores * 2) + 1. Adjust '4' based on your actual WSL2 CPU allocation.
workers = 4
max_cron_threads = 2
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560
limit_time_cpu = 60
limit_time_real = 120
limit_request = 1073741824
longpolling_port = 8072

; -----------------------------------------------------------------------------
; 7. CACHING & SESSIONS (Redis Integration)
; -----------------------------------------------------------------------------
session_redis = True
session_redis_host = 127.0.0.1
session_redis_port = 6379
session_redis_db = 1
session_redis_password = False
; session_redis_sentinel = False
; session_redis_sentinel_master = False
; cache = True
; cache_size = 10000

; -----------------------------------------------------------------------------
; 8. EMAIL CONFIGURATION (SMTP)
; -----------------------------------------------------------------------------
; smtp_server = localhost
; smtp_port = 25
; smtp_ssl = False
; smtp_user = False
; smtp_password = False
; email_from = False

; -----------------------------------------------------------------------------
; 9. REPORTING (PDF GENERATION)
; -----------------------------------------------------------------------------
wkhtmltopdf_path = /usr/bin/wkhtmltopdf
; reportgz = True

; -----------------------------------------------------------------------------
; 10. ADVANCED & MULTI-TENANCY
; -----------------------------------------------------------------------------
osv_memory_age_limit = 1.0
; osv_memory_count_limit = False
; saas = False
; saas_account = False
; saas_port = 8069

; -----------------------------------------------------------------------------
; 11. SECURITY (HTTPS / HSTS)
; -----------------------------------------------------------------------------
; hsts = False
; hsts_max_age = 31536000
; hsts_include_subdomains = False

; -----------------------------------------------------------------------------
; 12. DEVELOPER / DEBUG / TESTING OPTIONS
; -----------------------------------------------------------------------------
dev_mode = False
; test_enable = False
; test_file = False
; test_tags = False
demo = False
; without_demo = False
translate_modules = ['all']
; ignore_addons = []

; -----------------------------------------------------------------------------
; 13. GEOIP
; -----------------------------------------------------------------------------
; geoip_database = /usr/share/GeoIP/GeoLite2-City.mmdb

; -----------------------------------------------------------------------------
; 14. MISCELLANEOUS
; -----------------------------------------------------------------------------
; env_file = False
; timezone = False
