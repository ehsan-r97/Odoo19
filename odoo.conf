[options]
; =============================================================================
;                              ODOO 19 CONFIGURATION
; =============================================================================
; This configuration file is pre‑set for the following environment:
;   Ubuntu username : odoo19
;   Project root    : /home/odoo19/odoo19
;   Database user   : odoo19
;   All passwords   : 999239
;
; All available Odoo configuration options are included below with their
; default values (or your specific values where provided). Options that are
; commented out use the Odoo internal default.
; =============================================================================

dev_mode = all
; -----------------------------------------------------------------------------
; DATABASE CONNECTION
; -----------------------------------------------------------------------------
; Host where PostgreSQL is running. 'localhost' uses Unix domain socket if possible.
db_host = localhost
; Port number for PostgreSQL. False uses the default port (5432).
db_port = 5432
; Database username Odoo will use to connect.
db_user = odoo19
db_name = odoo19
; Password for the database user.
db_password = 999239
; Maximum number of physical PostgreSQL connections per Odoo worker process.
db_maxconn = 64
; SSL mode for the database connection. Options: disable, allow, prefer, require, verify-ca, verify-full.
db_sslmode = prefer
; Regular expression to filter which databases are displayed in the database manager.
dbfilter = ^odoo19$
; Template database used when creating new databases.
db_template = template0
; Enable the PostgreSQL unaccent extension on new databases (accent‑insensitive search).
unaccent = False


; -----------------------------------------------------------------------------
; NETWORK & WEB INTERFACE
; -----------------------------------------------------------------------------
; Port on which the Odoo HTTP service listens.
http_port = 8069
; Enable HTTPS (SSL/TLS) for connections. Requires a valid certificate.
https = False
; Set to True when Odoo is behind a reverse proxy (Nginx, Apache).
proxy_mode = False
; Maximum size (in bytes) of an HTTP request body. 1 GB by default.
limit_request = 1073741824
; Interface address to bind to. 0.0.0.0 listens on all interfaces.
http_interface = 0.0.0.0


; -----------------------------------------------------------------------------
; ADDONS PATHS & FILE STORAGE
; -----------------------------------------------------------------------------
; Comma‑separated list of directories where Odoo searches for addons.
; The first path is the Odoo core addons; the second is your custom modules.
addons_path = /home/odoo19/odoo19/odoo/addons,/home/odoo19/odoo19/custom_addons
; Directory where Odoo stores session data, attachments, and other files.
data_dir = /home/odoo19/odoo19/filestore


; -----------------------------------------------------------------------------
; SECURITY & MASTER PASSWORD
; -----------------------------------------------------------------------------
; Master password for database operations (create, backup, restore, duplicate).
; This is NOT your user login password. Change it in production!
admin_passwd = 999239


; -----------------------------------------------------------------------------
; LOGGING & MONITORING
; -----------------------------------------------------------------------------
; Path to the main log file. All Odoo messages are written here.
logfile = /home/odoo19/odoo19/logs/odoo.log
; Logging verbosity. Options: info, debug, warn, error, critical.
log_level = info
; Number of log files to keep during rotation (default: keep 30 files).
log_rotate = 30
; Send logs to the system syslog instead of a file.
syslog = False
; Handlers for the Python logging module. Leave empty to use the default.
log_handler = :INFO


; -----------------------------------------------------------------------------
; PERFORMANCE & WORKER PROCESSES
; -----------------------------------------------------------------------------
; Number of worker processes. 0 = single‑threaded (development).
; For production, set to (2 * CPU cores) + 1.
workers = 0
; Maximum number of threads dedicated to scheduled tasks (cron jobs).
max_cron_threads = 2
; Soft memory limit (in bytes). Worker is recycled if it exceeds this.
limit_memory_soft = 2147483648
; Hard memory limit (in bytes). Worker is killed immediately if exceeded.
limit_memory_hard = 2684354560
; Maximum CPU time (in seconds) allowed for a worker to process a request.
limit_time_cpu = 600
; Maximum real time (in seconds) allowed for a worker to process a request.
limit_time_real = 1200
; Enable the long‑polling worker (required for live chat and notifications).
longpolling_port = 8072


; -----------------------------------------------------------------------------
; EMAIL CONFIGURATION
; -----------------------------------------------------------------------------
; SMTP server for outgoing emails. localhost = no email sent.
smtp_server = localhost
; SMTP port (25, 465, 587).
smtp_port = 25
; Use SSL/TLS for the SMTP connection.
smtp_ssl = False
; SMTP username (if authentication is required).
smtp_user = False
; SMTP password.
smtp_password = False
; Email address used as the sender for all outgoing emails.
email_from = False


; -----------------------------------------------------------------------------
; REPORTING (PDF GENERATION)
; -----------------------------------------------------------------------------
; Path to the wkhtmltopdf binary.
wkhtmltopdf_path = /usr/bin/wkhtmltopdf


; -----------------------------------------------------------------------------
; CACHING & SESSIONS (Redis)
; -----------------------------------------------------------------------------
; Use Redis for session storage (recommended for multi‑worker setups).
; session_redis = False
; Redis host for session storage.
; session_redis_host = localhost
; Redis port for session storage.
; session_redis_port = 6379
; Redis database index for sessions.
; session_redis_db = 1
; Password for Redis if required.
; session_redis_password = False


; -----------------------------------------------------------------------------
; ADVANCED SETTINGS
; -----------------------------------------------------------------------------
; Modules to load automatically on server startup.
server_wide_modules = base,web
; Load demonstration data when creating a new database.
demo = False
; Maximum age (in hours) of a record kept in the ORM cache.
osv_memory_age_limit = 1.0
; Enable/disable the database manager interface.
list_db = False
; Timezone for the server. Default is the system timezone.
; timezone = False
; Translate module names in the Apps menu.
translate_modules = ['all']


; -----------------------------------------------------------------------------
; MULTI‑TENANCY / SAAS
; -----------------------------------------------------------------------------
; Enable the SaaS mode (restrict database operations).
; saas = False
; The account name used for SaaS.
; saas_account = False
; The port on which the SaaS server listens.
; saas_port = 8069


; -----------------------------------------------------------------------------
; SECURITY (HTTPS / HSTS)
; -----------------------------------------------------------------------------
; Enable HTTP Strict Transport Security.
; hsts = False
; HSTS max age in seconds.
; hsts_max_age = 31536000
; Include subdomains in HSTS policy.
; hsts_include_subdomains = False


; -----------------------------------------------------------------------------
; DEVELOPER / DEBUG OPTIONS
; -----------------------------------------------------------------------------
; Enable debug mode by default (never use in production!).
; debug_mode = False
; List of modules to ignore when loading (useful for development).
; ignore_addons = []


; -----------------------------------------------------------------------------
; GEOIP
; -----------------------------------------------------------------------------
; Path to the GeoIP database file.
; geoip_database = /usr/share/GeoIP/GeoLite2-City.mmdb


; -----------------------------------------------------------------------------
; MISCELLANEOUS
; -----------------------------------------------------------------------------
; Custom Python script to run after Odoo initialisation.
; unaccent = False
; Use a custom path for the server environment file.
; env_file = False