[options]
; =============================================================================
;                              ODOO 19 CONFIGURATION
; =============================================================================
; This configuration file is pre-set for:
;   - Ubuntu username: odoo19
;   - Project root:    /home/odoo19/odoo19
;   - Database user:   odoo19
;   - All passwords:   999239
; =============================================================================

; -----------------------------------------------------------------------------
; DATABASE CONNECTION
; -----------------------------------------------------------------------------
; Host where PostgreSQL is running. 'localhost' uses Unix socket if available.
db_host = localhost
; Port number for PostgreSQL. Default is 5432.
db_port = 5432
; Database username Odoo will use to connect.
db_user = odoo19
; Password for the database user (set to 999239 as requested).
db_password = 999239
; Maximum number of physical connections to PostgreSQL per worker.
db_maxconn = 64
; SSL mode for database connection. Options: disable, allow, prefer, require.
db_sslmode = prefer
; Regular expression to filter which databases appear in the database manager.
dbfilter = .*
; Template database used when creating new databases (template0 is safe).
db_template = template0
; Enable PostgreSQL unaccent extension for accent‑insensitive search.
unaccent = False

; -----------------------------------------------------------------------------
; NETWORK & WEB INTERFACE
; -----------------------------------------------------------------------------
; Port on which the Odoo HTTP service will listen.
http_port = 8069
; Enable HTTPS (SSL/TLS). Set to True only if you have a certificate.
https = False
; Enable proxy mode when Odoo is behind a reverse proxy like Nginx.
proxy_mode = True
; Maximum size (in bytes) of an HTTP request body (1 GB here).
limit_request = 1073741824

; -----------------------------------------------------------------------------
; ADDONS PATHS & FILE STORAGE
; -----------------------------------------------------------------------------
; Comma-separated list of directories where Odoo searches for addons.
; The first path is Odoo core addons; the second is your custom modules.
addons_path = /home/odoo19/odoo19/odoo/odoo/addons,/home/odoo19/odoo19/custom_addons
; Directory where Odoo stores session data, attachments, and other files.
data_dir = /home/odoo19/odoo19/filestore

; -----------------------------------------------------------------------------
; SECURITY & MASTER PASSWORD
; -----------------------------------------------------------------------------
; Master password for database operations (create, backup, restore, etc.).
; This is NOT your user login password. Change it in production!
admin_passwd = 999239

; -----------------------------------------------------------------------------
; LOGGING & MONITORING
; -----------------------------------------------------------------------------
; Path to the main log file. All Odoo messages are written here.
logfile = /home/odoo19/odoo19/logs/odoo.log
; Logging verbosity. Options: info, debug, warn, error, critical.
log_level = info
; Number of log files to keep during rotation (one per day default).
log_rotate = 30
; Send logs to the system syslog instead of a file. False = use file.
syslog = False

; -----------------------------------------------------------------------------
; PERFORMANCE & WORKER PROCESSES
; -----------------------------------------------------------------------------
; Number of worker processes. 0 = single‑threaded (development).
; For production, set to (2 * CPU cores) + 1.
workers = 0
; Maximum number of threads dedicated to scheduled tasks (cron jobs).
max_cron_threads = 2
; Soft memory limit (bytes) – worker recycled if exceeded.
limit_memory_soft = 2147483648
; Hard memory limit (bytes) – worker killed immediately if exceeded.
limit_memory_hard = 2684354560
; Maximum CPU time (seconds) allowed for a request.
limit_time_cpu = 600
; Maximum real time (seconds) allowed for a request.
limit_time_real = 1200

; -----------------------------------------------------------------------------
; EMAIL CONFIGURATION
; -----------------------------------------------------------------------------
; SMTP server for outgoing emails. Default is localhost (no email sent).
smtp_server = localhost
; SMTP port (25, 465, 587).
smtp_port = 25
; Use SSL for SMTP connection.
smtp_ssl = False
; SMTP username (if authentication required). False = no auth.
smtp_user = False
; SMTP password.
smtp_password = False

; -----------------------------------------------------------------------------
; REPORTING (PDF GENERATION)
; -----------------------------------------------------------------------------
; Path to the wkhtmltopdf binary. Ubuntu installs it here.
wkhtmltopdf_path = /usr/bin/wkhtmltopdf

; -----------------------------------------------------------------------------
; ADVANCED SETTINGS
; -----------------------------------------------------------------------------
; Modules to load automatically on server startup (base and web required).
server_wide_modules = base,web
; Load demonstration data when creating a new database.
demo = False
; Maximum age (in hours) of a record kept in the ORM cache.
osv_memory_age_limit = 1.0